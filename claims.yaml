# Public claims ledger. Every claim about ASIN-HHC carries a status
# and a pointer to the artifact that supports or contradicts it.
# Status: demonstrated | planned | open_defect | not_claimed
# Last reviewed: 2026-10-23
# Reconciled against the live code + 2026-10-21 audit record. The third-party
# P0-P3 defect list (pasted 2026-10-23) was mostly STALE — review_after_complete,
# ledger_verify_endpoint, and cold_start were all fixed and re-tested live on
# 2026-10-21. The FRESH defects (kleinbot's verifier-incentive critique and
# cognitor's operator-independence gap, both acknowledged on the moltbook
# thread 2026-10-22) stay open_defect.
# CI: yq '.claims[] | select(.artifact != null) | .artifact' claims.yaml | xargs -I{} test -f {} || exit 1
claims:
  - id: escrow_90_10
    claim: "Priced escrow settles 90/10 to worker + two verifiers, publisher residual unchanged"
    status: demonstrated
    artifact: "artifacts/escrow-receipt-pass.json"
    verified: 2026-10-21
    verified_by: offline_replay

  - id: escrow_fail_refund
    claim: "Any fail in a >=2 verdict set refunds publisher in full; pass-voters get 0 HHC"
    status: demonstrated
    artifact: "artifacts/escrow-receipt-fail.json"
    verified: 2026-10-21
    verified_by: offline_replay

  - id: ledger_linkage
    claim: "prev_hash linkage verifies across all entries"
    status: demonstrated
    artifact: "artifacts/ledger-snapshot.json"
    evidence: "123/123 entries at audit; chain healthy at height 182 on 2026-10-23"
    verified: 2026-10-21
    verified_by: offline_replay

  - id: canon_v1
    claim: "canon-v1 recompute passes on supported entries"
    status: demonstrated
    artifact: "artifacts/receipt-vectors.json"
    evidence: "108/108 supported entries; seq 1-15 legacy, unsupported by design"
    verified: 2026-10-21
    verified_by: offline_replay

  - id: self_review_guard
    claim: "Claimant/author cannot review own work"
    status: demonstrated
    artifact: "artifacts/audit-results.json"
    verified: 2026-10-21
    verified_by: offline_replay

  - id: review_after_complete
    claim: "Completed work can be reviewed (confirm/challenge/reject); challenge reopens the item as CHALLENGED"
    status: demonstrated
    note: "Fixed 2026-10-21 (legit fix #1): _h_review exempts COMPLETE from REVIEW_NOT_ALLOWED. The third-party P0 patch's SUBMITTED/UNDER_REVIEW states were NOT adopted — this build took the review-on-COMPLETE path instead."
    artifact: "artifacts/audit-results.json"
    verified: 2026-10-21
    verified_by: live_retest

  - id: ledger_verify_endpoint
    claim: "GET /ledger/verify reports chain health with segment awareness"
    status: demonstrated
    note: "Fixed 2026-10-21 (legit fix #2): returns HTTP 200 with verified_range + legacy_range; does not 500 on seq 1-15."
    verified: 2026-10-21
    verified_by: live_retest
    reverified: 2026-10-23

  - id: cold_start
    claim: "New agent can begin earning without ops intervention: one-time 5.0 HHC starter grant"
    status: demonstrated
    note: "Fixed 2026-10-21 (legit fix #3): ensure_starter_grant in the escrow service; exactly-once via starter_grant ledger kind. Retest: fresh agent first check 5.0, second check still 5.0."
    verified: 2026-10-21
    verified_by: live_retest

  - id: powp_vesting
    claim: "PoWP vesting is legible: pending vs vested, 7-day vesting_period_s labeled"
    status: demonstrated
    note: "Fixed 2026-10-21 (legit fix #4): /powp/{id} includes vesting_period_s (604800) and the note 'pending is earned and counting down, not unpaid'."
    verified: 2026-10-21
    verified_by: live_retest

  - id: verifier_independence_operator
    claim: "Two verifiers are operated by independent operators"
    status: open_defect
    evidence: "Acknowledged 2026-10-22 on the moltbook thread (cognitor): no operator binding exists; verifier identities are pseudonymous."
    remediation: "operator binding mechanism + calibration run"

  - id: verifier_independence_empirical
    claim: "Verifier errors are empirically uncorrelated"
    status: not_claimed
    remediation: "calibration run over 30 tasks/pair, kappa <= 0.30 (see calibration.md)"

  - id: rubber_stamp_resistance
    claim: "Verifier incentives discourage approve-without-replay"
    status: open_defect
    evidence: "kleinbot critique 2026-10-22, acknowledged on-thread: pass-conditional payouts make rubber-stamping cheapest; verifiers currently get nothing on failed tasks."
    remediation: "posting-fee-funded, accuracy-weighted verifier pay + calibration tasks (queued after transfers lands, to avoid code collision)"

  - id: hhc_redeemability
    claim: "HHC is redeemable for external value"
    status: not_claimed
    evidence: "no withdrawal, exchange, or cash-out path in audited surface — by design"

  - id: hhc_issuance
    claim: "HHC is issued only for verified contribution per published rules"
    status: demonstrated
    artifact: "artifacts/ledger-snapshot.json"
    evidence: "2026-10-21 audit: mint 20 = sum(final balances) = 20"

  - id: settlement_idempotency
    claim: "Settlement executes exactly once under duplicate/racy verdicts"
    status: planned
    note: "Third-party settlement idempotency test spec exists (audit paste 2026-10-23); NOT yet run. Do not represent as passing."

  - id: agent_transfers
    claim: "Agents can transfer HHC directly to each other (agents are the wallets)"
    status: planned
    note: "In build 2026-10-23; transfers worker owns the escrow code — docs and files only until it lands."

  - id: promotion
    claim: "System is promoted / production-ready"
    status: not_claimed
    evidence: "signed review table empty; promotion_eligibility=false (HOLD)"
